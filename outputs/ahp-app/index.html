<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AHP 决策工作台</title>
  <style>
    :root{--ink:#1a2b3d;--muted:#64748b;--blue:#1d4ed8;--mint:#e9f9ef;--line:#dbe4ee;--bg:#f4f7fb;--card:#fff;--red:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}header{background:linear-gradient(120deg,#073b4c,#1d4ed8);color:#fff;padding:20px max(5vw,24px)}.header-inner{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}.header-title{min-width:0}header h1{margin:0;font-size:26px}.partnership{margin-left:auto;text-align:center;flex:none}.partner-logos{height:44px;display:flex;align-items:center;justify-content:center;gap:14px}.partner-logo{display:block;object-fit:contain}.bozida-logo{width:95px;height:42px}.partner-divider{width:1px;height:29px;background:#ffffff8a}.ritsumeikan-logo{width:30px;height:42px;filter:brightness(0) invert(1)}.partnership-caption{margin-top:2px;font-size:12px;font-weight:650;letter-spacing:.02em;white-space:nowrap;opacity:.94}.shell{max-width:1240px;margin:22px auto;padding:0 20px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.step{padding:9px 13px;border:0;border-radius:999px;background:#e6edf7;color:#345;font-weight:700;cursor:pointer}.step.active{background:var(--blue);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #1020400a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.wide{grid-column:1/-1}label{display:grid;gap:5px;color:#40536a;font-weight:650}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-color:#cbd5e1;border-radius:8px;padding:8px;background:#fff}input:focus,select:focus{outline:3px solid #bfdbfe;border-color:#60a5fa}.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}.btn.alt{background:#e8eef8;color:#243b53}.btn.danger{background:#fee2e2;color:#991b1b}.hint{color:var(--muted);margin:5px 0 12px}.hide{display:none!important}h2{font-size:19px;margin:0 0 8px}h3{font-size:16px;margin:14px 0 8px}.list{display:grid;gap:8px}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}.matrix{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:9px}.matrix th,.matrix td{padding:7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;min-width:72px}.matrix th{background:#f8fafc;font-size:12px}.matrix tr:last-child>*{border-bottom:0}.matrix tr>*:last-child{border-right:0}.matrix select{min-width:70px;padding:5px}.matrix .diag{color:#94a3b8;background:#fafafa}.scroll{overflow:auto}.ok{color:#047857;font-weight:700}.warn{color:#b45309;font-weight:700}.bad{color:var(--red);font-weight:700}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.rank:last-child{border:0}.badge{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#dbeafe;color:#1e40af;font-weight:800}.meter{height:9px;background:#e5e7eb;border-radius:99px;flex:1;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#2563eb)}details{margin-top:10px}summary{cursor:pointer;font-weight:700}.notice{background:#fff7ed;border-left:4px solid #fb923c;padding:10px 12px;border-radius:5px}.chip{background:#e0f2fe;color:#075985;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}@media(max-width:650px){header{padding:21px 20px}.partnership{display:none}.shell{padding:0 12px}.card{padding:14px}}
  </style>
  <style>
    .hierarchy{background:linear-gradient(180deg,#f8fbff,#fff);border:1px solid #d8e5f5;border-radius:12px;padding:18px;overflow:auto}.hierarchy-title{margin:0 0 12px;font-size:18px}.hierarchy-flow{min-width:680px;display:grid;gap:10px}.hierarchy-tier{display:flex;justify-content:center;gap:14px;align-items:stretch}.hierarchy-arrow{color:#7c9abc;text-align:center;font-size:22px;line-height:1}.tree-node{background:#fff;border:1px solid #94b8e3;border-radius:9px;padding:8px 12px;min-width:112px;text-align:center;box-shadow:0 1px 3px #1e3a5f12;font-weight:700}.tree-goal{background:#0f4c81;border-color:#0f4c81;color:#fff;min-width:240px}.tree-alt{border-color:#34a06a;background:#effcf4}.tree-branch{display:grid;gap:8px;justify-items:center;min-width:140px}.tree-children{display:grid;gap:6px;width:100%}.tree-child{font-size:12px;font-weight:650;padding:5px 7px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;text-align:center}.tree-child.weak,.tree-node.weak{opacity:.38;filter:grayscale(.35)}.tree-note{font-size:12px;color:#64748b;margin:10px 0 0}.tree-summary{font-size:11px;color:#9a6700;text-align:center}.tree-weight{display:block;font-size:11px;font-weight:500;opacity:.72;margin-top:2px}.matrix td .badge{margin-left:auto;margin-right:auto}.badge.bad{background:#fee2e2;color:#b91c1c}.matrix{table-layout:fixed}.matrix th,.matrix td{width:1%;word-break:break-word}
  </style>
  <style>
    .graph-box{position:relative;height:155px;margin:14px 0 8px;border:1px solid #d7e5f5;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#fbfdff,#eff6ff);touch-action:none}.graph-note{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;color:#68809a;white-space:nowrap}.graph-axis{position:absolute;left:24px;right:24px;bottom:19px;height:2px;background:#a8bdd5;display:flex;justify-content:space-between;align-items:flex-end}.graph-axis span{font-size:11px;font-weight:700;color:#617994;transform:translateY(17px)}.graph-dot{position:absolute;width:17px;height:17px;padding:0;border:0;border-radius:50%;background:#2563eb;box-shadow:0 2px 0 #1e4299,0 3px 9px #2563eb55;transform:translate(-50%,-50%);cursor:grab;touch-action:none;z-index:3}.graph-dot.selected{width:22px;height:22px;background:#174db3;box-shadow:0 0 0 4px #bfdbfe,0 2px 0 #153e90}.graph-dot:active{cursor:grabbing}.graph-dot span{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid #bfdbfe;border-radius:6px;padding:2px 6px;color:#1e3a5f;font-size:12px;font-weight:700}.graph-projection{position:absolute;width:1px;background:#8ab6f4;border-left:1px dashed #8ab6f4;opacity:.8;z-index:1}.graph-projection::after{content:"";position:absolute;left:50%;bottom:-4px;width:7px;height:7px;border-radius:50%;background:#2563eb;transform:translateX(-50%)}.graph-pair-line{position:absolute;bottom:17px;height:5px;background:linear-gradient(90deg,#93bbfb,#2563eb);border-radius:99px;z-index:2}.graph-pair-line span{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);white-space:nowrap;border:1px solid #93b8f2;border-radius:6px;background:#fff;padding:2px 6px;color:#174ea6;font-size:11px;font-weight:800}.graph-value{font-variant-numeric:tabular-nums;color:#1e3a8a;background:#f8fbff}.matrix-input{min-width:64px;text-align:center;padding:5px}.matrix-toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin:10px 0}.matrix-mode-cr{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.matrix-mode-cr label{min-width:180px}.matrix-status{padding:8px 0;white-space:nowrap}.matrix td:has(.matrix-input){padding:4px}.matrix td:has(select){padding:4px}@media(max-width:650px){.graph-box{height:138px}.graph-note{font-size:11px}.graph-dot span{font-size:11px}.graph-axis{left:18px;right:18px}.matrix-mode-cr{width:100%;justify-content:space-between}.matrix-mode-cr label{min-width:0;flex:1}}
  </style>
</head>
<body>
<header><div class="header-inner"><div class="header-title"><h1>AHP 决策工作台</h1></div><div class="partnership" aria-label="博咨达与立命馆大学联合研究"><div class="partner-logos"><img class="partner-logo bozida-logo" src="assets/bozida-logo-white.png" alt="博咨达"><span class="partner-divider" aria-hidden="true"></span><img class="partner-logo ritsumeikan-logo" src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Ritsumeikan_University_logo.svg" alt="立命馆大学"></div><div class="partnership-caption">博咨达-立命馆大学爆品研发共同研究</div></div></div></header>
<main class="shell">
  <nav class="bar" id="nav"></nav>
  <section id="about" class="page"></section><section id="setup" class="page hide"></section><section id="criteria" class="page hide"></section><section id="subcriteria" class="page hide"></section><section id="abc" class="page hide"></section><section id="alternatives" class="page hide"></section><section id="result" class="page hide"></section>
</main>
<script>
const RI={1:0,2:0,3:.58,4:.90,5:1.12,6:1.24,7:1.32,8:1.41,9:1.45,10:1.49,11:1.51,12:1.48,13:1.56,14:1.57,15:1.59};
const scale=[1/9,1/8,1/7,1/6,1/5,1/4,1/3,1/2,1,2,3,4,5,6,7,8,9];
const label=(v,a,b)=>{let n=v<1?Math.round(1/v):v,scaleText=n===1?'1':v>1?String(n):`1/${n}`,grade={1:'同等重要／同等优势',2:'略占优势',3:'较为重要／具备一定优势',4:'介于较为与很重要之间',5:'很重要／具备优势',6:'介于很重要与非常重要之间',7:'非常重要／具备很大优势',8:'介于非常与极其重要之间',9:'极其重要／具备极大优势'}[n];return n===1?`${scaleText}｜${grade}`:`${scaleText}｜${esc(v>1?a:b)} ＞ ${esc(v>1?b:a)}｜${grade}`};
let S=JSON.parse(localStorage.getItem('ahp-workbench')||'null')||{goal:'选择最佳方案',criteria:['指标 1','指标 2','指标 3'],alternatives:['方案 A','方案 B','方案 C'],group:false,method:'geo',people:[{name:'决策者 1',weight:1}],active:0,child:{},judges:{}};
S.minMode??=false;S.minimums??={};S.childMinimums??={};S.child??={};S.childOpen??={};S.people??=[{name:'决策者 1',weight:1}];S.matrixModes??={};S.graphs??={};if(S.graphVersion!==2){S.graphs={};S.graphVersion=2;save()}if(S.method==='geo')S.people.forEach(p=>p.weight=1);
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function save(){localStorage.setItem('ahp-workbench',JSON.stringify(S))} function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hide'));$('#'+id).classList.remove('hide');document.querySelectorAll('.step').forEach(x=>x.classList.toggle('active',x.dataset.p===id));render()}
function hasSubcriteria(){return Object.values(S.child).some(x=>(x||[]).length>0)}
function nav(){let a=[['about','说明'],['setup','1 设置'],['criteria','2 指标权重']];if(hasSubcriteria())a.push(['subcriteria','3 子指标权重'],['abc','4 ABC筛选'],['alternatives','5 方案评价'],['result','6 结果']);else a.push(['alternatives','3 方案评价'],['result','4 结果']);$('#nav').innerHTML=a.map(([p,t])=>`<button class="step" data-p="${p}" onclick="page('${p}')">${t}</button>`).join('') }
function listEditor(id,title,items,kind){return `<div class="card"><h2>${title}</h2><p class="hint">最多 15 项；项目较多时建议通过子指标建立层次结构。</p><div class="list">${items.map((x,i)=>`<div class="row"><input value="${esc(x)}" oninput="S.${kind}[${i}]=this.value;save();refreshHierarchy()"><button class="btn danger" onclick="S.${kind}.splice(${i},1);save();render()">删除</button></div>`).join('')}</div><button class="btn alt" ${items.length>=15?'disabled':''} onclick="S.${kind}.push('${kind==='criteria'?'新指标':'新方案'}');save();render()">+ 添加</button></div>`}
function minimumEditor(){return `<div class="card"><h2>各评估指标的最低期望水平</h2><p class="hint">填写可接受的最低标准（如“客户满意度 ≥ 85 分”）。在方案评价时，系统会把它作为一个基准方案加入成对比较。</p><div class="grid">${S.criteria.map((x,i)=>`<label>${esc(x)}<input placeholder="例如：≥ 85 分" value="${esc(S.minimums[i]||'')}" oninput="S.minimums[${i}]=this.value;save()"></label>`).join('')}</div></div>`}
function selectedChildMinimumEditor(){let e=effectiveCriteria(),items=e.selected.filter(x=>x.isChild);if(!S.minMode||!items.length)return '';return `<div class="card"><h2>各筛选子指标的最低期望水平</h2><p class="hint">ABC 入选的子指标将以此最低期望水平作为基准方案参与方案评价。未填写时，方案评价页会提示补充。</p><div class="grid">${items.map(x=>`<label>${esc(x.name)}<input placeholder="例如：≥ 85 分" value="${esc(S.childMinimums[x.id]||'')}" oninput="S.childMinimums['${x.id}']=this.value;save()"></label>`).join('')}</div></div>`}
function addChild(i){S.child??={};S.childOpen??={};if(!Array.isArray(S.child[i]))S.child[i]=[];if(S.child[i].length>=15)return;S.child[i].push('子指标 '+(S.child[i].length+1));S.childOpen[i]=true;save();render()}
function removeChild(i,j){if(!Array.isArray(S.child[i]))return;S.child[i].splice(j,1);S.childOpen[i]=true;save();render()}
function childEditor(){return `<div class="card"><h2>子指标（可选）</h2><p class="hint">添加后会启用“子指标权重”和“ABC 筛选”页面。</p>${S.criteria.map((c,i)=>`<details ${S.childOpen[i]?'open':''} ontoggle="S.childOpen[${i}]=this.open;save()"><summary>${esc(c)}${(S.child[i]||[]).length?`（${(S.child[i]||[]).length} 个子指标）`:''}</summary><div class="card"><div class="list">${(S.child[i]||[]).map((x,j)=>`<div class="row"><input value="${esc(x)}" oninput="S.child[${i}][${j}]=this.value;save()"><button type="button" class="btn danger" data-remove-child="${i}" data-remove-index="${j}">删除</button></div>`).join('')}</div><button type="button" class="btn alt" ${(S.child[i]||[]).length>=15?'disabled':''} onclick="addChild(${i})">+ 添加子指标</button></div></details>`).join('')}</div>`}
function importPanel(){return `<div class="card"><h2>导入已保存的决策</h2><p class="hint">选择由本工作台导出的 JSON 文件，可恢复课题、指标、方案、成员、全部成对比较及结果设置。</p><label>选择 JSON 文件<input type="file" accept="application/json,.json" onchange="importJson(this)"></label></div>`}
function saatyNotice(){return `<div class="notice">评分使用 Saaty 1–9 标度；系统使用方根法（行几何平均）计算权重，并按 RI 表计算 CR。一致性建议：CR ≤ 0.10。</div>`}
function hierarchyDiagram(){let top=calc(S.criteria,aggregate('criteria','root',S.criteria.length)).w,e=effectiveCriteria(),chosen=new Set(e.selected.map(x=>x.id)),abc=e.hasSub;let branches=S.criteria.map((c,i)=>{let kids=S.child[i]||[],active=kids.filter((_,j)=>chosen.has(`c${i}-${j}`));let weak=abc&&kids.length&&active.length===0;if(!kids.length)return `<div class="tree-branch"><div class="tree-node">${esc(c)}<span class="tree-weight">权重 ${(top[i]*100).toFixed(1)}%</span></div></div>`;let shown=abc?active:kids,hidden=kids.length-shown.length;return `<div class="tree-branch"><div class="tree-node ${weak?'weak':''}">${esc(c)}<span class="tree-weight">权重 ${(top[i]*100).toFixed(1)}%</span></div><div class="tree-children">${shown.map(x=>`<div class="tree-child">${esc(x)}</div>`).join('')}${hidden?`<div class="tree-summary">其余 ${hidden} 项已由 ABC 分析筛选排除</div>`:''}</div></div>`}).join('');return `<div class="card"><h2 class="hierarchy-title">当前层次结构图</h2><div class="hierarchy"><div class="hierarchy-flow"><div class="hierarchy-tier"><div class="tree-node tree-goal">${esc(S.goal||'决策课题')}</div></div><div class="hierarchy-arrow">↓</div><div class="hierarchy-tier">${branches}</div>${hasSubcriteria()?`<div class="tree-note">${abc?'ABC 分析筛选后，仅突出显示入选子指标；未入选项已排除。':'已显示子指标层。'}</div>`:''}<div class="hierarchy-arrow">↓</div><div class="hierarchy-tier">${S.alternatives.map(x=>`<div class="tree-node tree-alt">${esc(x)}</div>`).join('')}</div></div></div><p class="tree-note">课题 → 评估指标${hasSubcriteria()?' → 子指标':''} → 候选方案</p></div>`}
function refreshHierarchy(){let holder=$('#hierarchy-holder');if(holder)holder.innerHTML=hierarchyDiagram()}
function importJson(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data||!Array.isArray(data.criteria)||!Array.isArray(data.alternatives)||typeof data.judges!=='object')throw new Error();S={goal:'选择最佳方案',criteria:[],alternatives:[],group:false,method:'geo',people:[{name:'决策者 1',weight:1}],active:0,child:{},childOpen:{},judges:{},minMode:false,minimums:{},childMinimums:{},matrixModes:{},graphs:{},graphVersion:2,...data};S.people??=[{name:'决策者 1',weight:1}];S.child??={};S.childOpen??={};S.minimums??={};S.childMinimums??={};S.matrixModes??={};S.graphs??={};S.graphVersion??=2;if(S.method==='geo')S.people.forEach(p=>p.weight=1);save();page('setup');alert('已导入决策数据。')}catch{alert('无法导入：请选择由本工作台导出的有效 JSON 文件。')}finally{input.value=''}};reader.readAsText(file,'UTF-8')}
function renderSetup(){ $('#setup').innerHTML=`<div class="card"><h2>决策结构</h2><div class="grid"><label class="wide">决策课题<input value="${esc(S.goal)}" oninput="S.goal=this.value;save();refreshHierarchy()"></label><label>AHP 流程<select onchange="S.minMode=this.value==='minimum';save();render()"><option value="basic" ${!S.minMode?'selected':''}>基本 AHP</option><option value="minimum" ${S.minMode?'selected':''}>最低期望水平 AHP</option></select></label><label>决策模式<select onchange="S.group=this.value==='group';save();render()"><option value="single" ${!S.group?'selected':''}>单人决策</option><option value="group" ${S.group?'selected':''}>群决策</option></select></label>${S.group?`<label>群体汇总方式<select onchange="S.method=this.value;if(S.method==='geo')S.people.forEach(p=>p.weight=1);save();render()"><option value="geo" ${S.method==='geo'?'selected':''}>几何平均（默认）</option><option value="weighted" ${S.method==='weighted'?'selected':''}>加权平均</option></select></label>`:''}</div>${S.group?peopleEditor():''}</div>${listEditor('criteria','评估指标',S.criteria,'criteria')}${S.minMode?minimumEditor():''}${childEditor()}${selectedChildMinimumEditor()}${listEditor('alternatives','候选方案',S.alternatives,'alternatives')}<div id="hierarchy-holder">${hierarchyDiagram()}</div>${importPanel()}` }
function peopleEditor(){return `<h3>群决策成员</h3><p class="hint">${S.method==='geo'?'几何平均模式下，各成员权重均等。如要为成员设置不同权重，请选择“加权平均”作为群体汇总方式。':'可为成员设置相对权重。'}</p><div class="list">${S.people.map((p,i)=>`<div class="row"><input value="${esc(p.name)}" oninput="S.people[${i}].name=this.value;save()">${S.method==='weighted'?`<input type="number" min="0" step=".1" value="${p.weight}" title="成员权重" oninput="S.people[${i}].weight=+this.value;save()">`:''}<button class="btn danger" onclick="S.people.splice(${i},1);S.active=0;save();render()">删除</button></div>`).join('')}</div><button class="btn alt" onclick="S.people.push({name:'决策者 '+(S.people.length+1),weight:1});save();render()">+ 添加成员</button>`}
function key(type,subject,person){return `${type}|${subject}|${person}`}function modeKey(type,subject){return `${type}|${subject}`}function pairs(n){let a=[];for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)a.push([i,j]);return a}
function vals(type,subject,n,person){let k=key(type,subject,person),o=S.judges[k]||{};return pairs(n).map(([i,j])=>+o[`${i}-${j}`]||1)}function put(type,subject,person,i,j,v){let k=key(type,subject,person);S.judges[k]??={};S.judges[k][`${i}-${j}`]=+v;save()}function cellValue(type,subject,n,person,i,j){if(i===j)return 1;let z=pairs(n).findIndex(x=>x[0]===Math.min(i,j)&&x[1]===Math.max(i,j)),v=vals(type,subject,n,person)[z];return i<j?v:1/v}function syncGraphFromJudgements(type,subject,person,n){let r=calc(Array(n).fill(''),vals(type,subject,n,person)),logs=r.w.map(Math.log),lo=Math.min(...logs),hi=Math.max(...logs),span=hi-lo,g=graphData(type,subject,person,n),factor=span?Math.min(92/span,100/Math.log(9)):0;g.forEach((p,i)=>p.x=span?Math.max(4,Math.min(96,50+(logs[i]-(hi+lo)/2)*factor)):50);save()}function putCell(type,subject,person,i,j,v,n){v=+v;if(!Number.isFinite(v)||v<=0)return;if(i>j){[i,j]=[j,i];v=1/v}put(type,subject,person,i,j,v);syncGraphFromJudgements(type,subject,person,n)}function nearestScale(v){return scale.reduce((best,x)=>Math.abs(x-v)<Math.abs(best-v)?x:best,scale[0])}function matrixMode(type,subject){return S.matrixModes[modeKey(type,subject)]||'scale'}function setMatrixMode(type,subject,mode,n){if(mode==='scale')S.people.forEach((_,p)=>pairs(n).forEach(([i,j])=>put(type,subject,p,i,j,nearestScale(vals(type,subject,n,p)[pairs(n).findIndex(x=>x[0]===i&&x[1]===j)]))));S.people.forEach((_,p)=>syncGraphFromJudgements(type,subject,p,n));S.matrixModes[modeKey(type,subject)]=mode;save();render()}
function aggregate(type,subject,n){if(!S.group)return vals(type,subject,n,0);let w=S.people.map(p=>+p.weight||0),total=w.reduce((a,b)=>a+b,0)||1;return pairs(n).map((_,z)=>{let x=S.people.map((p,i)=>vals(type,subject,n,i)[z]);return S.method==='geo'?Math.exp(x.reduce((a,v,i)=>a+(w[i]/total)*Math.log(v),0)):x.reduce((a,v,i)=>a+v*w[i],0)/total})}
function calc(names, ps){let n=names.length,A=Array.from({length:n},()=>Array(n).fill(1));pairs(n).forEach(([i,j],z)=>{A[i][j]=ps[z];A[j][i]=1/ps[z]});let gm=A.map(r=>Math.pow(r.reduce((a,b)=>a*b,1),1/n)),sum=gm.reduce((a,b)=>a+b,0),w=gm.map(v=>v/sum),aw=A.map(r=>r.reduce((a,v,j)=>a+v*w[j],0)),lambda=aw.reduce((a,v,i)=>a+v/w[i],0)/n,ci=n<3?0:(lambda-n)/(n-1),cr=n<3?0:ci/(RI[n]||1.59);return {A,w,lambda,ci,cr}}
function effectiveCriteria(){let top=calc(S.criteria,aggregate('criteria','root',S.criteria.length)).w,all=[],hasSub=false;S.criteria.forEach((c,i)=>{let kids=S.child[i]||[];if(kids.length>0){hasSub=true;let w=calc(kids,aggregate('child',i,kids.length)).w;kids.forEach((x,j)=>all.push({name:`${c} / ${x}`,shortName:x,isChild:true,weight:top[i]*w[j],id:`c${i}-${j}`,parent:i}))}else all.push({name:c,shortName:c,isChild:false,weight:top[i],id:`c${i}`,parent:i})});if(!hasSub)return {all,selected:all,hasSub:false};let sorted=[...all].sort((a,b)=>b.weight-a.weight),sum=0,selected=[];for(let x of sorted){if(selected.length>=15)break;selected.push(x);sum+=x.weight;if(sum>=.8)break}return {all,selected,hasSub:true}}
function optionNames(item){let minimum=item.isChild?(S.childMinimums[item.id]||'未填写'):(S.minimums[item.parent]||'未填写');return S.minMode?[...S.alternatives,`最低期望：${minimum}`]:S.alternatives}
function picker(type,subject,n,i,j,person,names){let v=cellValue(type,subject,n,person,i,j);return `<select onchange="putCell('${type}','${subject}',${person},${i},${j},this.value,${n});render()">${scale.map(x=>`<option value="${x}" ${Math.abs(x-v)<1e-9?'selected':''}>${label(x,names[i],names[j])}</option>`).join('')}</select>`}function inputter(type,subject,n,i,j,person){let v=cellValue(type,subject,n,person,i,j);return `<input class="matrix-input" type="number" min="${1/9}" max="9" step="any" value="${graphNumber(v)}" onchange="putCell('${type}','${subject}',${person},${i},${j},this.value,${n});render()" aria-label="${i+1} 对 ${j+1} 的相对重要度">`}function graphData(type,subject,person,n){let k=key(type,subject,person),g=S.graphs[k];if(!Array.isArray(g)||g.length!==n){g=Array.from({length:n},(_,i)=>({x:50,y:27+(i%4)*14}));S.graphs[k]=g}return g}function graphApply(type,subject,person,n){let g=graphData(type,subject,person,n);pairs(n).forEach(([i,j])=>put(type,subject,person,i,j,Math.pow(9,(g[i].x-g[j].x)/100)))}function graphWidget(names,type,subject,person){let g=graphData(type,subject,person,names.length),k=key(type,subject,person),sel=graphSelections[k]||[],pair='';if(sel.length===2){let [i,j]=sel,a=Math.min(g[i].x,g[j].x),w=Math.max(1,Math.abs(g[i].x-g[j].x)),v=cellValue(type,subject,names.length,person,i,j);pair=`<div class="graph-pair-line" style="left:${a}%;width:${w}%"><span>${esc(names[i])} / ${esc(names[j])} = ${graphNumber(v)}</span></div>`}return `<div class="graph-box" data-graph="${type}|${subject}|${person}|${names.length}"><div class="graph-note">向右表示更重要；点击两点查看投影关系</div><div class="graph-axis"><span>较不重要</span><span>较重要</span></div>${g.map(p=>`<div class="graph-projection" style="left:${p.x}%;top:${p.y}%;bottom:20px"></div>`).join('')}${pair}${names.map((name,i)=>`<button class="graph-dot ${sel.includes(i)?'selected':''}" style="left:${g[i].x}%;top:${g[i].y}%" data-graph-dot="${type}|${subject}|${person}|${names.length}|${i}" aria-label="拖动或选择 ${esc(name)}"><span>${esc(name)}</span></button>`).join('')}</div><p class="hint">拖动任意点后，系统以横向位置生成连续相对比值；投影线上显示选中两点对应的表格关系。</p>`}function graphNumber(v){return (Math.round(v*1000)/1000).toString()}
function deviationPanel(names,r){let d=r.A.map((row,i)=>row.map((v,j)=>Math.abs(v*r.w[j]-r.A[i].reduce((s,x,k)=>s+x*r.w[k],0))));let h=`<details><summary>特征值与权重偏差（用于定位可调整评分）</summary><p class="hint">单元格显示 |aᵢⱼ × wⱼ − (Aw)ᵢ|。每一行中，最小偏差为白色、最大偏差为红色，中间值按比例渐变；可优先复核颜色更深的评分。</p><div class="scroll"><table class="matrix"><tr><th>行 / 列</th>${names.map(x=>`<th>${esc(x)}</th>`).join('')}<th>(Aw)ᵢ</th></tr>`;for(let i=0;i<names.length;i++){let aw=r.A[i].reduce((s,x,k)=>s+x*r.w[k],0),lo=Math.min(...d[i]),hi=Math.max(...d[i]);h+=`<tr><th>${esc(names[i])}</th>`;for(let j=0;j<names.length;j++){let t=hi===lo?0:(d[i][j]-lo)/(hi-lo),red=Math.round(255-16*t),green=Math.round(255-187*t),blue=Math.round(255-187*t),ink=t>.62?'#991b1b':'#1a2b3d';h+=`<td style="background:rgb(${red},${green},${blue});color:${ink};font-weight:${t>.62?750:400}">${d[i][j].toFixed(4)}</td>`}h+=`<td>${aw.toFixed(4)}</td></tr>`}return h+`</table></div></details>`}
function matrix(title,names,type,subject){let p=S.active,mode=matrixMode(type,subject);if(mode==='graph')graphApply(type,subject,p,names.length);let ps=aggregate(type,subject,names.length),r=calc(names,ps),shown=S.group?vals(type,subject,names.length,p):ps,inputR=calc(names,shown),who=S.group?`<label>当前填写人<select onchange="S.active=+this.value;render()">${S.people.map((x,i)=>`<option value="${i}" ${i===p?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:'';let modeSelect=`<label>评价方式<select onchange="setMatrixMode('${type}','${subject}',this.value,${names.length})"><option value="graph" ${mode==='graph'?'selected':''}>图形控件模式</option><option value="scale" ${mode==='scale'?'selected':''}>标度选择模式</option><option value="input" ${mode==='input'?'selected':''}>填写模式</option></select></label>`,status=`<div class="matrix-status"><span class="chip">CR = ${r.cr.toFixed(3)}</span> <span class="${r.cr<=.1?'ok':'warn'}">${r.cr<=.1?'一致性可接受':'建议调整判断'}</span></div>`;let h=`<div class="card"><h2>${title}</h2><div class="matrix-toolbar">${who}<div class="matrix-mode-cr">${modeSelect}${status}</div></div>${mode==='graph'?graphWidget(names,type,subject,p):''}<div class="scroll"><table class="matrix"><tr><th></th>${names.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>`;for(let i=0;i<names.length;i++){h+=`<tr><th>${esc(names[i])}</th>`;for(let j=0;j<names.length;j++){let v=cellValue(type,subject,names.length,p,i,j);h+=i===j?'<td class="diag">1</td>':mode==='graph'?`<td class="graph-value">${graphNumber(v)}</td>`:`<td>${mode==='scale'?picker(type,subject,names.length,i,j,p,names):inputter(type,subject,names.length,i,j,p)}</td>`}h+='</tr>'}let panel=S.group?deviationPanel(names,inputR)+`<p class="hint">当前填写人的 CR：${inputR.cr.toFixed(3)}；页首 CR 为群体汇总后的结果。</p>`:deviationPanel(names,r);return h+`</table></div>${panel}<details><summary>查看本矩阵权重与检验</summary><p>λmax ${r.lambda.toFixed(4)}；CI ${r.ci.toFixed(4)}；权重：${names.map((x,i)=>`${esc(x)} ${(r.w[i]*100).toFixed(2)}%`).join('，')}</p></details></div>`}

function paretoChart(items){let w=760,h=260,p={l:42,r:22,t:18,b:54},iw=w-p.l-p.r,ih=h-p.t-p.b,cum=0,bw=iw/items.length;let ticks=[0,.2,.4,.6,.8,1].map(v=>{let y=p.t+ih-v*ih;return `<line x1="${p.l}" y1="${y}" x2="${w-p.r}" y2="${y}" stroke="#e2e8f0"/><text x="${p.l-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#64748b">${Math.round(v*100)}%</text>`}).join('');let bars=items.map((x,i)=>{let bh=x.weight*ih,xx=p.l+i*bw+5,yy=p.t+ih-bh;return `<rect x="${xx}" y="${yy}" width="${Math.max(3,bw-10)}" height="${bh}" fill="${x.selected?'#2563eb':'#94a3b8'}"/><text x="${xx+bw/2-5}" y="${h-20}" font-size="10" text-anchor="middle">${i+1}</text>`}).join('');let pts=items.map((x,i)=>{cum+=x.weight;return `${p.l+(i+.5)*bw},${p.t+ih-cum*ih}`}).join(' '),y80=p.t+ih*.2;return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="ABC 帕累托图" style="width:100%;min-width:560px;background:#fff">${ticks}<line x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${p.t+ih}" stroke="#94a3b8"/><line x1="${p.l}" y1="${p.t+ih}" x2="${w-p.r}" y2="${p.t+ih}" stroke="#94a3b8"/><line x1="${p.l}" y1="${y80}" x2="${w-p.r}" y2="${y80}" stroke="#f97316" stroke-dasharray="5 4"/><text x="${w-p.r-2}" y="${y80-4}" font-size="11" text-anchor="end" fill="#c2410c">80%</text>${bars}<polyline points="${pts}" fill="none" stroke="#ef4444" stroke-width="3"/></svg>`}
function renderAbc(){let e=effectiveCriteria(),sorted=[...e.all].sort((a,b)=>b.weight-a.weight),chosen=new Set(e.selected.map(x=>x.id)),sum=0;sorted.forEach(x=>{sum+=x.weight;x.cum=sum;x.selected=chosen.has(x.id)});$('#abc').innerHTML=`<div class="card"><h2>ABC 筛选</h2><p class="hint">柱形为全局权重，红线为累计权重；橙色虚线为 80%。蓝色柱为入选项，按累计前 80%且最多 15 项筛选。</p><div class="scroll">${paretoChart(sorted)}</div></div><div class="card"><h2>全局指标权重（ABC 入选）</h2><div class="scroll"><table class="matrix"><tr><th>排序</th><th>子指标</th><th>全局权重</th><th>累计权重</th></tr>${sorted.filter(x=>x.selected).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${(x.weight*100).toFixed(2)}%</td><td>${(x.cum*100).toFixed(2)}%</td></tr>`).join('')}</table></div></div>`}
function renderAlternatives(){let e=effectiveCriteria(),missing=e.selected.filter(x=>x.isChild&&!S.childMinimums[x.id]),h=`<div class="card"><h2>方案评价</h2><p class="hint">对每个参与评价的指标，比较候选方案的优劣。${S.minMode?'最低期望水平会作为最后一列基准方案；最终排序将包含该基准。':''}</p>${e.hasSub?`<p class="notice">本页仅显示 ABC 筛选后的指标：${e.selected.length} / ${e.all.length} 项。</p>`:''}${S.minMode&&e.selected.some(x=>x.isChild)?`<p class="notice">请先回到“设置”页，在“各筛选子指标的最低期望水平（可选）”中填写基准。${missing.length?`当前仍有 ${missing.length} 项未填写。`:''}</p>`:''}${saatyNotice()}</div>`;e.selected.forEach(x=>h+=matrix(`按「${x.shortName}」评价方案`,optionNames(x),'alternative',x.id));$('#alternatives').innerHTML=h}
function renderResult(){let cr=calc(S.criteria,aggregate('criteria','root',S.criteria.length)),e=effectiveCriteria(),names=S.minMode?[...S.alternatives,'最低期望水平']:S.alternatives,details=names.map((name,i)=>({name,i,parts:[],score:0}));e.selected.forEach(x=>{let matrixNames=optionNames(x),weights=calc(matrixNames,aggregate('alternative',x.id,matrixNames.length)).w;details.forEach((row,i)=>{let part=x.weight*weights[i];row.parts.push(part);row.score+=part})});let order=[...details].sort((a,b)=>b.score-a.score),minRow=S.minMode?details.at(-1):null,minRank=S.minMode?order.findIndex(x=>x.i===minRow.i):-1;let headers=e.selected.map(x=>`<th title="${esc(x.name)}">${esc(x.shortName)}</th>`).join('');let rows=order.map((row,rank)=>{let below=S.minMode&&rank>minRank;let cells=row.parts.map((p,i)=>{let low=S.minMode&&row.i!==minRow.i&&p<minRow.parts[i];return `<td class="${low?'bad':''}">${(p*100).toFixed(2)}%</td>`}).join('');return `<tr><td><span class="badge ${below?'bad':''}">${rank+1}</span></td><td class="${below?'bad':''}"><strong>${esc(row.name)}</strong></td>${cells}<td class="${below?'bad':''}"><strong>${(row.score*100).toFixed(2)}%</strong></td></tr>`}).join('');$('#result').innerHTML=`<div class="card"><h2>${esc(S.goal)}：推荐结果</h2><p class="${cr.cr<=.1?'ok':'warn'}">指标层 CR = ${cr.cr.toFixed(3)} ${cr.cr<=.1?'，通过一致性检验。':'，请先回到“指标权重”调整不一致的判断。'}</p>${e.hasSub?`<p class="hint">ABC 分析后，${e.selected.length} 项指标参与了方案综合评价。</p>`:''}${S.minMode?`<p class="hint">以“最低期望水平”为基准，排名低于该基准的方案及其低于基准的指标得分以红色显示。</p>`:''}<div class="scroll"><table class="matrix"><tr><th>排名</th><th>方案</th>${headers}<th>综合得分</th></tr>${rows}</table></div></div><div class="card"><button class="btn" onclick="download()">导出决策数据（JSON）</button><button class="btn alt" onclick="if(confirm('清空当前所有判断？')){localStorage.removeItem('ahp-workbench');location.reload()}">重置工作台</button></div>`}
function renderAbout(){$('#about').innerHTML=`<div class="card"><h2>什么是 AHP？</h2><p>AHP（Analytic Hierarchy Process，层次分析法）由 Thomas L. Saaty 于 1971 年提出，用于在不确定或评价因素较多的决策情境中，基于要素重要度的两两比较来辅助选择。</p><p>它的特点是先建立与决策有关的层次结构：决策课题位于顶层，评估指标位于中间层，多个候选方案位于底层；当指标需要进一步细分时，可以增加子指标层。随后通过两两比较得到权重，并据此对方案进行综合排序。</p></div><div class="card"><h2>使用流程</h2><ol><li>在“设置”中填写课题、评估指标与候选方案。</li><li>在指标和方案矩阵中按 Saaty 1–9 标度完成两两比较。</li><li>查看 CR 一致性检验；若偏高，可参考“特征值与权重偏差”优先复核相关评分。</li><li>如有子指标，先完成子指标权重并在 ABC 页面确认入选项，再进行方案评价。</li><li>在结果页查看综合排序，并可导出 JSON 保存当前决策。</li></ol></div><div class="card"><h2>常见问题</h2><h3>为什么采用 1–9 标度？</h3><p>心理学研究认为，人们对两个事物属性的差异通常能较可靠地区分约 5–9 个等级。1–9 标度既能表达重要度差异，也不会因刻度过细而降低判断稳定性。</p><h3>方根法与和积法选哪个？</h3><p>两者计算的权重通常非常接近。方根法（行几何平均法）先计算判断矩阵各行的几何平均数，再归一化得到权重；和积法则先按列归一化、再求行均值。本工作台采用方根法。</p><h3>一致性检验不通过怎么办？</h3><p>CR ≤ 0.10 一般视为满足一致性。若 CR &gt; 0.10，请检查是否出现逻辑矛盾，例如“甲比乙重要、乙比丙重要，却判断丙明显比甲重要”。可优先调整偏差较大的评分。0.10–0.15 在部分初步研究中可接受，但应说明理由；CR &gt; 0.15 建议重新评估。</p><h3>1 阶或 2 阶矩阵还需要一致性检验吗？</h3><p>不需要。此时随机一致性指标 RI 为 0，且判断矩阵天然完全一致。</p><h3>单层指标数量多少合适？</h3><p>经典 Saaty RI 表可覆盖到 15 阶，但指标过多会显著增加判断难度。超过 15 项时，建议通过子指标建立层次结构后分组比较。</p></div>`}

let graphDrag=null,graphSelections={};if(document.addEventListener){document.addEventListener('click',e=>{let button=e.target.closest&&e.target.closest('[data-remove-child]');if(!button)return;e.preventDefault();e.stopPropagation();removeChild(Number(button.dataset.removeChild),Number(button.dataset.removeIndex))});document.addEventListener('pointerdown',e=>{let dot=e.target.closest&&e.target.closest('[data-graph-dot]');if(!dot)return;e.preventDefault();let [type,subject,person,n,index]=dot.dataset.graphDot.split('|');graphDrag={type,subject,person:+person,n:+n,index:+index,dot,box:dot.closest('.graph-box'),startX:e.clientX,startY:e.clientY,moved:false};dot.setPointerCapture?.(e.pointerId)});window.addEventListener('pointermove',e=>{if(!graphDrag)return;let r=graphDrag.box.getBoundingClientRect(),x=Math.max(4,Math.min(96,(e.clientX-r.left)/r.width*100)),y=Math.max(25,Math.min(77,(e.clientY-r.top)/r.height*100)),g=graphData(graphDrag.type,graphDrag.subject,graphDrag.person,graphDrag.n);graphDrag.moved||=(Math.abs(e.clientX-graphDrag.startX)>3||Math.abs(e.clientY-graphDrag.startY)>3);g[graphDrag.index]={x,y};graphDrag.dot.style.left=`${x}%`;graphDrag.dot.style.top=`${y}%`});window.addEventListener('pointerup',()=>{if(!graphDrag)return;let d=graphDrag,k=key(d.type,d.subject,d.person);if(d.moved)graphApply(d.type,d.subject,d.person,d.n);else{let a=graphSelections[k]||[];graphSelections[k]=a.includes(d.index)?a.filter(x=>x!==d.index):a.length<2?[...a,d.index]:[a[1],d.index]}graphDrag=null;save();render()})}
